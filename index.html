<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackJack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./BlackJack.css">
</head>
<body>
    <main>
        <section class="begin" id="begin">
            <div class="outer">
                <h1>BlackJack</h1>
                <label for="playerName">請輸入玩家名字</label>
                <input type="text" id="playerName">
                <input type="button" id="newGame" value="開始遊戲">
                <input type="button" id="rulesBtnHome" value="遊戲規則" style="margin-top: 0;">
            </div>
        </section>
        <section class="bet-zone displaynone" id="betZone">
            <label for="roundBet">請選擇本局下注金額</label>
            <input type="number" id="roundBet" value="100" min="10" step="10">
            <input type="button" id="startBetBtn" value="下注並開局">
        </section>
        <section class="table">
            <button id="rulesBtnGame" class="rule-icon-btn">規則</button>
            <section class="title">
                <h1>BlackJack</h1>
            </section>
            <section class="dealer-zone">
                <div class="score-area">
                    <h2>莊家</h2>
                    <p>目前點數：<span id="dealerPoints"></span></p>
                    <p>籌碼：$<span id="dealerMoney">1000</span></p>
                </div>
                <div class="deck">
                    <div class="card"><span class="value-zone"></span><div class="dealer-cards card-img" id="dealerCard1"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="dealer-cards card-img" id="dealerCard2"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="dealer-cards card-img" id="dealerCard3"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="dealer-cards card-img" id="dealerCard4"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="dealer-cards card-img" id="dealerCard5"></div></div>
                </div>
            </section>
            <section class="player-zone">
                <div class="score-area">
                    <h2 id="pName">玩家</h2>
                    <p>目前點數：<span id="playerPoints"></span></p>
                    <p>籌碼：$<span id="playerMoney">1000</span></p>
                </div>
                <div class="deck">
                    <div class="card"><span class="value-zone"></span><div class="player-cards card-img" id="playerCard1"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="player-cards card-img" id="playerCard2"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="player-cards card-img" id="playerCard3"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="player-cards card-img" id="playerCard4"></div></div>
                    <div class="card"><span class="value-zone"></span><div class="player-cards card-img" id="playerCard5"></div></div>
                </div>
            </section>
            <section class="btn-area">
                <input type="button" value="再來一張！" id="hit" disabled>
                <input type="button" value="不拿牌了！" id="stand" disabled>
            </section>
        </section>
        <section id="rulesModal" class="displaynone winnerImg">
            <div class="winner-outer rules-outer">
                <h2>遊戲規則</h2>
                <div class="rules-content">
                    <div class="rule-item">
                        <span class="rule-badge">目標</span>
                        <span class="rule-text">點數比莊家大且不超過 21 點</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge">點數</span>
                        <span class="rule-text">J / Q / K 算 10 點 <br> A 可算 1 或 11 點</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge">莊家</span>
                        <span class="rule-text">未滿 17 點強制補牌<br>達 17 點即停牌</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge">特例</span>
                        <span class="rule-text">超過 21 點直接輸<br>抽 5 張牌沒超過21點 直接贏</span>
                    </div>
                </div>
                <input type="button" id="closeRulesBtn" value="我知道了">
            </div>
        </section>
        <section id="winnerImg" class="displaynone winnerImg">
            <div class="winner-outer">
                <h1>遊戲結束</h1>
                <div>
                    <div>
                        <p id="namespace"></p>
                        <p> </p>
                        <p>莊家</p>
                    </div>
                    <div>
                        <p id="playerPoint"></p>
                        <p>：</p>
                        <p id="dealerPoint"></p>
                    </div>
                </div>
                <h3 id="winnerName"></h3>
                <input type="button" id="restart" value="再玩一次">
            </div>
        </section>
    </main>
    <script type="module" src="./BlackJack.js"></script>
</body>
</html>
